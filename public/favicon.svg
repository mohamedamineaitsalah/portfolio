<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1e3a8a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2563eb;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fbbf24;stop-opacity:1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background container with rounded corners -->
  <rect width="512" height="512" rx="128" fill="url(#primaryGrad)"/>

  <!-- Border outline -->
  <rect x="8" y="8" width="496" height="496" rx="120" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="12"/>

  <!-- Monogram MA -->
  <g filter="url(#glow)">
    <text 
      x="256" 
      y="335" 
      font-family="Arial Black, Impact, Montserrat, sans-serif" 
      font-size="240" 
      font-weight="900" 
      letter-spacing="-12" 
      text-anchor="middle" 
      fill="#ffffff">MA</text>
  </g>

  <!-- Dynamic accent indicator dot -->
  <circle cx="410" cy="330" r="28" fill="url(#accentGrad)" stroke="#1e3a8a" stroke-width="6"/>
</svg>